<svg xmlns="http://www.w3.org/2000/svg" class="parcel-scene" width="640" height="365" viewBox="0 0 640 365" role="img" aria-label="多个任务打包成快递箱并送走">
<title>多个任务打包成快递箱并送走</title><defs><style>
.parcel-scene text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#59624b}
@keyframes parcel-cycle{0%,3%,100%{opacity:0}10%,82%{opacity:1}96%{opacity:0}}
@keyframes parcel-task{0%,5%{opacity:0;transform:translate(var(--x),calc(var(--y) + 14px)) rotate(var(--r)) scale(.94)}12%,28%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}34%{opacity:1;transform:translate(var(--x),calc(var(--y) - 6px)) rotate(var(--r)) scale(1)}39%{opacity:1;transform:translate(var(--mx),var(--my)) rotate(var(--mr)) scale(.88)}45%{opacity:.9;transform:translate(0,-4px) rotate(120deg) scale(.7)}49%,100%{opacity:0;transform:translate(0,12px) rotate(240deg) scale(.04)}}
@keyframes parcel-box{0%,36%{opacity:0;transform:translateY(18px) scale(.68)}41%,45%{opacity:1;transform:translateY(6px) scale(.98)}48%{opacity:1;transform:translateY(-2px) scale(1.08)}52%{opacity:1;transform:translateY(4px) scale(.96)}57%,65%{opacity:1;transform:translateY(0) scale(1)}75%{opacity:1;transform:translate(62px,-14px) rotate(5deg) scale(1)}86%{opacity:.4;transform:translate(265px,-59px) rotate(17deg) scale(.85)}92%,100%{opacity:0;transform:translate(365px,-84px) rotate(21deg) scale(.75)}}
@keyframes parcel-lid{0%,44%{transform:translateY(-39px) rotate(-6deg) scaleY(1.5)}49%{transform:translateY(0) scaleY(1)}52%{transform:translateY(2px) scaleY(.94)}56%,100%{transform:translateY(0) scaleY(1)}}
@keyframes parcel-snap{0%,48%,61%,100%{opacity:0;transform:scale(.6)}51%{opacity:1;transform:scale(1)}58%{opacity:0;transform:scale(1.35)}}
@keyframes parcel-word{0%,49%,66%,100%{opacity:0;transform:translateY(10px) rotate(-10deg)}53%{opacity:1;transform:translateY(0) rotate(-10deg)}62%{opacity:0;transform:translateY(-15px) rotate(-10deg)}}
@keyframes parcel-trail{0%,66%,91%,100%{opacity:0;transform:translateX(0)}73%{opacity:.6;transform:translateX(0)}84%{opacity:0;transform:translateX(100px)}}
.parcel-scene .p-cycle{animation:parcel-cycle 14s linear infinite}
.parcel-scene .p-task{opacity:0;animation:parcel-task 14s cubic-bezier(.4,0,.2,1) infinite}
.parcel-scene .p-box{animation:parcel-box 14s cubic-bezier(.4,0,.2,1) infinite}
.parcel-scene .p-lid{transform-box:fill-box;transform-origin:center;animation:parcel-lid 14s cubic-bezier(.3,1.3,.5,1) infinite}
.parcel-scene .p-snap{opacity:0;animation:parcel-snap 14s linear infinite}
.parcel-scene .p-word{opacity:0;transform-box:fill-box;transform-origin:center;animation:parcel-word 14s linear infinite}
.parcel-scene .p-trail{opacity:0;animation:parcel-trail 14s linear infinite}

@keyframes parcel-gather{0%,15%,48%,100%{opacity:0;transform:scale(.75) rotate(-20deg)}23%{opacity:.5;transform:scale(1) rotate(-10deg)}35%{opacity:.5;transform:scale(.86) rotate(45deg)}46%{opacity:0;transform:scale(.15) rotate(110deg)}}
@keyframes parcel-top-tape{0%,54%{opacity:0;transform:scaleX(.02)}57%{opacity:1;transform:scaleX(.02)}64%,100%{opacity:1;transform:scaleX(1)}}
@keyframes parcel-side-tape{0%,60%{opacity:0;transform:scaleY(.02)}62%{opacity:1;transform:scaleY(.02)}67%,100%{opacity:1;transform:scaleY(1)}}
@keyframes parcel-label{0%,62%{opacity:0;transform:translate(-26px,-8px) rotate(-17deg) scale(.9)}67%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1.08)}70%,100%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}}
@keyframes parcel-stamp{0%,67%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.35)}73%,100%{opacity:1;transform:scale(1)}}
.parcel-scene .p-gather{transform-box:fill-box;transform-origin:center;animation:parcel-gather 14s ease-in-out infinite}
.parcel-scene .p-top-tape{transform-box:fill-box;transform-origin:left;animation:parcel-top-tape 14s linear infinite}
.parcel-scene .p-side-tape{transform-box:fill-box;transform-origin:top;animation:parcel-side-tape 14s linear infinite}
.parcel-scene .p-label{transform-box:fill-box;transform-origin:center;animation:parcel-label 14s cubic-bezier(.3,1.3,.5,1) infinite}
.parcel-scene .p-stamp{transform-box:fill-box;transform-origin:center;animation:parcel-stamp 14s cubic-bezier(.3,1.3,.5,1) infinite}

@media(prefers-reduced-motion:reduce){.parcel-scene *{animation:none!important}.parcel-scene .p-task,.parcel-scene .p-snap,.parcel-scene .p-word,.parcel-scene .p-trail,.parcel-scene .p-gather{display:none}}
</style><filter id="parcel-shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#566149" flood-opacity=".14"/></filter></defs>
