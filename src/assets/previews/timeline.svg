<path d="m205 379-39-12 35-24" fill="none" stroke="#292f23" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g class="drift" filter="url(#shadow)"><circle cx="480" cy="270" r="92" fill="url(#ink)"/><circle cx="480" cy="270" r="73" fill="#f6f5eb" stroke="#b9c2aa" stroke-width="2"/>
<path d="M480 210v10m60 50h-10m-50 60v-10m-60-50h10" stroke="#79876c" stroke-width="3" stroke-linecap="round"/>
<path d="M480 270v-44" stroke="#222c1b" stroke-width="7" stroke-linecap="round" class="clock-hand"/>
<path d="M480 270l25 16" stroke="#9eab8b" stroke-width="5" stroke-linecap="round"/>
<circle cx="480" cy="270" r="8" fill="#ffd400"/>
</g>
