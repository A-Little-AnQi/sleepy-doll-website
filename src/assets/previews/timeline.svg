<svg stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="循环运行的任务轨道">
<title>循环运行的任务轨道</title><desc>按原始通用元素的构图重绘。采用 Pudding 图标的米白、灰棕、浅桃、酒红与灰蓝配色、柔和描边和分层平涂，保留原始漂浮与流动动画。</desc><defs><style>
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-11px)}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes voice{0%,100%{transform:scaleY(.38)}35%{transform:scaleY(1)}65%{transform:scaleY(.62)}}
@keyframes stream{to{stroke-dashoffset:-744}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.22}50%{opacity:.66}}
.drift{animation:drift 5s ease-in-out infinite}.delay1{animation-delay:-1.5s}.delay2{animation-delay:-3s}.delay3{animation-delay:-4s}
.voice{transform-box:fill-box;transform-origin:center;animation:voice 2.1s ease-in-out infinite}
.stream{stroke-dasharray:35 337;animation:stream 7s linear infinite}.reverse{animation-direction:reverse}
.orbit{transform-origin:480px 270px;animation:turn 24s linear infinite}.clock-hand{transform-origin:480px 270px;animation:turn 12s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.stream{stroke-dasharray:none;opacity:.7}}
</style>





