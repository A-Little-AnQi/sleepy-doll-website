<ellipse cx="480" cy="260" rx="295" ry="131" transform="rotate(-16 480 270)" fill="none" stroke="url(#gold)" stroke-width="37"/>
<ellipse cx="480" cy="260" rx="295" ry="131" transform="rotate(-16 480 270)" fill="none" stroke="#2f3627" stroke-width="2"/>
<ellipse cx="480" cy="260" rx="295" ry="131" transform="rotate(-16 480 270)" fill="none" stroke="#fff1a0" stroke-width="5" class="stream"/>
