.query-scene .query-input-9{animation:query-input-9 11s linear infinite}@keyframes query-output-0{0%,39.091%{opacity:0}39.191%,89%{opacity:1}97%,100%{opacity:0}}
.query-scene .query-output-0{animation:query-output-0 11s linear infinite}@keyframes query-output-1{0%,41.273%{opacity:0}41.373%,89%{opacity:1}97%,100%{opacity:0}}
.query-scene .query-output-1{animation:query-output-1 11s linear infinite}@keyframes query-output-2{0%,43.455%{opacity:0}43.555%,89%{opacity:1}97%,100%{opacity:0}}
.query-scene .query-output-2{animation:query-output-2 11s linear infinite}@keyframes query-output-3{0%,45.636%{opacity:0}45.736%,89%{opacity:1}97%,100%{opacity:0}}
