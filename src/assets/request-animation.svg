.query-scene .query-output-7{animation:query-output-7 11s linear infinite}@keyframes query-output-8{0%,56.545%{opacity:0}56.645%,89%{opacity:1}97%,100%{opacity:0}}
.query-scene .query-output-8{animation:query-output-8 11s linear infinite}@keyframes query-output-9{0%,58.727%{opacity:0}58.827%,89%{opacity:1}97%,100%{opacity:0}}
.query-scene .query-output-9{animation:query-output-9 11s linear infinite}@keyframes query-caret{0%,8%{opacity:0;transform:translateX(0)}7.636%{opacity:1;transform:translateX(0px)}9.182%{opacity:1;transform:translateX(28px)}10.727%{opacity:1;transform:translateX(56px)}12.273%{opacity:1;transform:translateX(84px)}13.818%{opacity:1;transform:translateX(112px)}15.364%{opacity:1;transform:translateX(140px)}16.909%{opacity:1;transform:translateX(168px)}18.455%{opacity:1;transform:translateX(196px)}20.000%{opacity:1;transform:translateX(224px)}21.545%{opacity:1;transform:translateX(252px)}23.091%{opacity:1;transform:translateX(280px)}27%,100%{opacity:0;transform:translateX(280px)}}
.query-scene .q-caret{animation:query-caret 11s steps(1,end) infinite}@media(prefers-reduced-motion:reduce){.query-scene *{animation:none!important}.query-scene .q-pointer,.query-scene .q-hit,.query-scene .q-caret{display:none}.query-scene .q-send{opacity:.5}.query-scene .q-request{opacity:.5}}</style></defs>
