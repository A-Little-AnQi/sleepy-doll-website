<svg xmlns="http://www.w3.org/2000/svg" class="query-scene" width="640" height="235" viewBox="0 0 640 235" role="img" aria-label="输入要求、点击发送并流式查找脚本">
<title>输入要求、点击发送并流式查找脚本</title><defs><style>
.query-scene text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#292e24}
@keyframes query-cycle{0%,3%,100%{opacity:0}8%,86%{opacity:1}96%{opacity:0}}
@keyframes query-float{0%,100%{transform:translateY(4px)}50%{transform:translateY(-5px)}}
@keyframes query-request{0%,27%{opacity:1}36%,100%{opacity:.48}}
@keyframes query-send{0%,26%{transform:scale(1);opacity:1}29%{transform:scale(.83);opacity:1}32%{transform:scale(1);opacity:1}40%,100%{transform:translate(62px,-36px) scale(.9);opacity:0}}
@keyframes query-pointer{0%,19%,39%,100%{opacity:0;transform:translate(28px,46px)}22%{opacity:1;transform:translate(28px,46px)}27%{opacity:1;transform:translate(0,0)}29%{opacity:1;transform:translate(1px,2px) scale(.92)}32%{opacity:1;transform:translate(0,0)}37%{opacity:0;transform:translate(16px,22px)}}
@keyframes query-hit{0%,27%,39%,100%{opacity:0;transform:scale(.3)}29%{opacity:.62;transform:scale(.65)}36%{opacity:0;transform:scale(1.8)}}
@keyframes query-search{0%,37%,100%{opacity:0}42%,87%{opacity:1}}
@keyframes query-turn{to{transform:rotate(360deg)}}
.query-scene .q-cycle{animation:query-cycle 11s linear infinite}
.query-scene .q-float{animation:query-float 5.5s ease-in-out infinite}
.query-scene .q-request{animation:query-request 11s linear infinite}
.query-scene .q-send{transform-box:fill-box;transform-origin:center;animation:query-send 11s linear infinite}
.query-scene .q-pointer{opacity:0;animation:query-pointer 11s linear infinite}
.query-scene .q-hit{opacity:0;transform-box:fill-box;transform-origin:center;animation:query-hit 11s linear infinite}
.query-scene .q-search{animation:query-search 11s linear infinite}
.query-scene .q-spin{transform-origin:35px 165px;animation:query-turn 4s linear infinite}
@keyframes query-input-0{0%,8.182%{opacity:0}8.282%,89%{opacity:1}97%,100%{opacity:0}}
.query-scene .query-input-0{animation:query-input-0 11s linear infinite}@keyframes query-input-1{0%,9.727%{opacity:0}9.827%,89%{opacity:1}97%,100%{opacity:0}}
